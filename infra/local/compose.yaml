name: kwartrack-backend-local

services:
  floci:
    image: floci/floci:2.4.0@sha256:5ee85db604c4aa74ac76e07ea5cc83086f37bb472bf3dbb97e34019e48efae9c
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:7001-7004:7001-7004"
      - "127.0.0.1:8080:8080"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_SECURITY_EXTRA_CORS_ALLOWED_ORIGINS: http://127.0.0.1:5174,http://localhost:5174
      FLOCI_SECURITY_EXTRA_CORS_ALLOWED_HEADERS: content-type,x-amz-target,x-amz-user-agent,amz-sdk-invocation-id,amz-sdk-request
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_DOCKER_NETWORK: kwartrack-backend-local
      FLOCI_DOCKER_RESOURCE_NAMESPACE: kwartrack-backend-local
      FLOCI_DOCKER_EXTRA_LABELS_0__KEY: io.kwartrack.project
      FLOCI_DOCKER_EXTRA_LABELS_0__VALUE: kwartrack-backend-local
      FLOCI_SERVICES_RDS_MOCK: "false"
      FLOCI_SERVICES_RDS_PROXY_BASE_PORT: "7001"
      FLOCI_SERVICES_RDS_PROXY_MAX_PORT: "7004"
      FLOCI_SERVICES_RDS_ENDPOINT_HOST: floci
      FLOCI_SERVICES_RDS_DEFAULT_POSTGRES_IMAGE: postgres:16.6-alpine@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef
      FLOCI_DOCKER_IMAGE_PULL_TIMEOUT_SECONDS: "120"
      FLOCI_DOCKER_API_TIMEOUT_SECONDS: "30"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-data:/app/data
    networks:
      backend:
        ipv4_address: 172.29.240.2

  api:
    profiles: [api]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment: &api-environment
      APP_ENV: local
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      API_INSTANCE_ID: api-1
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DATABASE_URL: ${API_CONTAINER_DATABASE_URL:-}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck: &api-healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready',{signal:AbortSignal.timeout(2000)}).then(r=>{if(r.status!==200)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      backend:
        ipv4_address: 172.29.240.10

  api-second:
    profiles: [smoke]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *api-environment
      API_INSTANCE_ID: api-2
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck: *api-healthcheck
    networks:
      backend:
        ipv4_address: 172.29.240.11

volumes:
  floci-data:

networks:
  backend:
    name: kwartrack-backend-local
    ipam:
      config:
        - subnet: 172.29.240.0/24
